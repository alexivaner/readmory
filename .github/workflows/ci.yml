name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm exec playwright test --config playwright.storage.config.ts
      - name: Build GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /readmory
      - name: Verify GitHub Pages paths and offline storage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm test:e2e tests/e2e/basepath.spec.ts
        env:
          E2E_BASE_PATH: /readmory
          TEST_BASE_URL: http://127.0.0.1:3000/readmory/
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy public app
        id: deployment
        uses: actions/deploy-pages@v4
